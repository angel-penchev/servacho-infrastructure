name: Feature request
description: Propose an improvement to the infrastructure or its automation.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Propose the desired outcome and explain how it supports this infrastructure.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired configuration, automation, or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives or workarounds, if any.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - OpenTofu configuration
        - GitHub Actions workflow
        - NixOS management plane
        - Proxmox configuration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: Optional technical considerations, dependencies, or risks.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
