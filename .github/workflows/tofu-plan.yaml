name: OpenTofu Plan

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Unseal OpenBao
        uses: angel-penchev/infrastructure-reusables/actions/openbao-unseal@v0
        with:
          unseal_keys: ${{ secrets.OPENBAO_UNSEAL_KEY }}
          vault_addr: ${{ env.VAULT_ADDR }}

      # Before anything reads the flake or the modules: a pull request that
      # moves one side of the infrastructure-reusables pin without the other
      # fails here.
      - name: infrastructure-reusables pins
        run: scripts/check-reusables-pins.sh

      - name: OpenTofu plan
        uses: angel-penchev/infrastructure-reusables/actions/tofu-plan@v0
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
