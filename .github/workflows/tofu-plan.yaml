name: OpenTofu Plan

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Auto-Unseal OpenBao (if sealed)
        env:
          UNSEAL_KEYS: ${{ secrets.OPENBAO_UNSEAL_KEYS }}
        run: |
          if command -v curl >/dev/null 2>&1; then CURL_CMD="curl -s"; else CURL_CMD="nix run nixpkgs#curl -- -s"; fi
          if $CURL_CMD http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
            echo "OpenBao is sealed. Attempting to auto-unseal..."
            if [ -z "$UNSEAL_KEYS" ]; then
              echo "Error: OPENBAO_UNSEAL_KEYS secret is not set. Please add it to GitHub repository secrets."
              exit 1
            fi
            for key in $(echo "$UNSEAL_KEYS" | tr ',' ' ' | tr '\n' ' '); do
              if [ -n "$key" ]; then
                $CURL_CMD --request PUT --data "{\"key\": \"$key\"}" http://127.0.0.1:8200/v1/sys/unseal > /dev/null
              fi
            done
            if $CURL_CMD http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
              echo "OpenBao is still sealed. Ensure you provided enough valid keys."
              exit 1
            else
              echo "OpenBao successfully unsealed!"
            fi
          else
            echo "OpenBao is already unsealed."
          fi

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu plan
        id: plan
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: |
          set -o pipefail
          tofu -chdir=tofu plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = 'plan_output.txt';
            let planOutput = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output found.';
            const maxLen = 60000;
            if (planOutput.length > maxLen) {
              planOutput = `...truncated...\n\n${planOutput.slice(-maxLen)}`;
            }
            const status = process.env.PLAN_EXIT_CODE === '0' ? 'Success' : 'Failed';
            const timestamp = new Date().toUTCString();
            const body = [
              '### OpenTofu Plan Results',
              `**Status:** ${status}`,
              `**Generated:** ${timestamp}`,
              '',
              '```hcl',
              planOutput,
              '```'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('### OpenTofu Plan Results');
            });
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail workflow if plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "OpenTofu plan failed. See PR comment for details."
          exit 1
