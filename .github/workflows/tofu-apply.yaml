name: OpenTofu Apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to apply
        required: true
        default: main
        type: string
      auto_approve:
        description: Apply without waiting for GitHub environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  # The apply's outcome is posted on the pull request it belongs to.
  pull-requests: write

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply-automatically:
    if: github.event_name == 'push' || inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Unseal OpenBao
        uses: angel-penchev/infrastructure-reusables/actions/openbao-unseal@a967eee66b1b32e6154d8839f3e1230dfc4a222a # v0.5.0
        with:
          unseal_keys: ${{ secrets.OPENBAO_UNSEAL_KEY }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: Unseal the tenant management planes
        uses: ./.github/actions/unseal-tenant-planes
        # The root pipeline does not depend on the tenants' planes; a failure
        # here is reported and the run goes on.
        continue-on-error: true
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu apply
        uses: angel-penchev/infrastructure-reusables/actions/tofu-apply@a967eee66b1b32e6154d8839f3e1230dfc4a222a # v0.5.0
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          branch: ${{ inputs.branch }}

  apply-with-approval:
    if: github.event_name == 'workflow_dispatch' && !inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    environment:
      name: tofu-apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Unseal OpenBao
        uses: angel-penchev/infrastructure-reusables/actions/openbao-unseal@a967eee66b1b32e6154d8839f3e1230dfc4a222a # v0.5.0
        with:
          unseal_keys: ${{ secrets.OPENBAO_UNSEAL_KEY }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: Unseal the tenant management planes
        uses: ./.github/actions/unseal-tenant-planes
        # The root pipeline does not depend on the tenants' planes; a failure
        # here is reported and the run goes on.
        continue-on-error: true
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu apply
        uses: angel-penchev/infrastructure-reusables/actions/tofu-apply@a967eee66b1b32e6154d8839f3e1230dfc4a222a # v0.5.0
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          branch: ${{ inputs.branch }}
