name: OpenTofu Apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to apply
        required: true
        default: main
        type: string
      auto_approve:
        description: Apply without waiting for GitHub environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  # The apply's outcome is posted on the pull request it belongs to.
  pull-requests: write

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply-automatically:
    if: github.event_name == 'push' || inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Auto-Unseal OpenBao (if sealed)
        uses: ./.github/actions/auto-unseal
        with:
          unseal_key: ${{ secrets.OPENBAO_UNSEAL_KEY }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: Unseal the tenant management planes
        uses: ./.github/actions/unseal-tenant-planes
        # The root pipeline does not depend on the tenants' planes; a failure
        # here is reported and the run goes on.
        continue-on-error: true
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_ROOT_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        id: apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_ROOT_TOKEN }}
        run: |
          set -o pipefail
          tofu -chdir=tofu apply -auto-approve -no-color -input=false 2>&1 | tee apply_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post apply results to the pull request
        uses: ./.github/actions/post-apply-comment
        with:
          exit_code: ${{ steps.apply.outputs.exit_code }}
          branch: ${{ inputs.branch }}

      - name: Fail workflow if apply failed
        if: steps.apply.outputs.exit_code != '0'
        run: |
          echo "OpenTofu apply failed. See the pull request comment or the log above."
          exit 1

  apply-with-approval:
    if: github.event_name == 'workflow_dispatch' && !inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    environment:
      name: tofu-apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Auto-Unseal OpenBao (if sealed)
        uses: ./.github/actions/auto-unseal
        with:
          unseal_key: ${{ secrets.OPENBAO_UNSEAL_KEY }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: Unseal the tenant management planes
        uses: ./.github/actions/unseal-tenant-planes
        # The root pipeline does not depend on the tenants' planes; a failure
        # here is reported and the run goes on.
        continue-on-error: true
        with:
          vault_token: ${{ secrets.OPENBAO_ROOT_TOKEN }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_ROOT_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        id: apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_ROOT_TOKEN }}
        run: |
          set -o pipefail
          tofu -chdir=tofu apply -auto-approve -no-color -input=false 2>&1 | tee apply_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post apply results to the pull request
        uses: ./.github/actions/post-apply-comment
        with:
          exit_code: ${{ steps.apply.outputs.exit_code }}
          branch: ${{ inputs.branch }}

      - name: Fail workflow if apply failed
        if: steps.apply.outputs.exit_code != '0'
        run: |
          echo "OpenTofu apply failed. See the pull request comment or the log above."
          exit 1
