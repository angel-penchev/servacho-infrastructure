name: OpenTofu Apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to apply
        required: true
        default: main
        type: string
      auto_approve:
        description: Apply without waiting for GitHub environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply-automatically:
    if: github.event_name == 'push' || inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Auto-Unseal OpenBao (if sealed)
        uses: ./.github/actions/auto-unseal
        with:
          unseal_keys: ${{ secrets.OPENBAO_UNSEAL_KEYS }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu apply -auto-approve

  apply-with-approval:
    if: github.event_name == 'workflow_dispatch' && !inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    environment:
      name: tofu-apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Auto-Unseal OpenBao (if sealed)
        uses: ./.github/actions/auto-unseal
        with:
          unseal_keys: ${{ secrets.OPENBAO_UNSEAL_KEYS }}
          vault_addr: ${{ env.VAULT_ADDR }}

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu apply -auto-approve
