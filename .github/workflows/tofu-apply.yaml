name: OpenTofu Apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to apply
        required: true
        default: main
        type: string
      auto_approve:
        description: Apply without waiting for GitHub environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply-automatically:
    if: github.event_name == 'push' || inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Auto-Unseal OpenBao (if sealed)
        env:
          UNSEAL_KEYS: ${{ secrets.OPENBAO_UNSEAL_KEYS }}
        run: |
          if curl -s http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
            echo "OpenBao is sealed. Attempting to auto-unseal..."
            if [ -z "$UNSEAL_KEYS" ]; then
              echo "Error: OPENBAO_UNSEAL_KEYS secret is not set. Please add it to GitHub repository secrets."
              exit 1
            fi
            for key in $(echo "$UNSEAL_KEYS" | tr ',' ' ' | tr '\n' ' '); do
              if [ -n "$key" ]; then
                curl -s --request PUT --data "{\"key\": \"$key\"}" http://127.0.0.1:8200/v1/sys/unseal > /dev/null
              fi
            done
            if curl -s http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
              echo "OpenBao is still sealed. Ensure you provided enough valid keys in OPENBAO_UNSEAL_KEYS."
              exit 1
            else
              echo "OpenBao successfully unsealed!"
            fi
          else
            echo "OpenBao is already unsealed."
          fi

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu apply -auto-approve

  apply-with-approval:
    if: github.event_name == 'workflow_dispatch' && !inputs.auto_approve
    runs-on: [self-hosted, servacho-management-plane]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    environment:
      name: tofu-apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Auto-Unseal OpenBao (if sealed)
        env:
          UNSEAL_KEYS: ${{ secrets.OPENBAO_UNSEAL_KEYS }}
        run: |
          if curl -s http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
            echo "OpenBao is sealed. Attempting to auto-unseal..."
            if [ -z "$UNSEAL_KEYS" ]; then
              echo "Error: OPENBAO_UNSEAL_KEYS secret is not set. Please add it to GitHub repository secrets."
              exit 1
            fi
            for key in $(echo "$UNSEAL_KEYS" | tr ',' ' ' | tr '\n' ' '); do
              if [ -n "$key" ]; then
                curl -s --request PUT --data "{\"key\": \"$key\"}" http://127.0.0.1:8200/v1/sys/unseal > /dev/null
              fi
            done
            if curl -s http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":true'; then
              echo "OpenBao is still sealed. Ensure you provided enough valid keys in OPENBAO_UNSEAL_KEYS."
              exit 1
            else
              echo "OpenBao successfully unsealed!"
            fi
          else
            echo "OpenBao is already unsealed."
          fi

      - name: OpenTofu init
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu init

      - name: OpenTofu apply
        env:
          VAULT_TOKEN: ${{ secrets.OPENBAO_TOFU_TOKEN }}
        run: tofu -chdir=tofu apply -auto-approve
