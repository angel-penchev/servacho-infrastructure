name: "Auto-Unseal OpenBao"
description: "Automatically detects if OpenBao is sealed and unseals it using provided keys."
inputs:
  unseal_key:
    description: "The unseal keys for OpenBao (space, comma, or newline separated)"
    required: true
  vault_addr:
    description: "The address of the OpenBao/Vault server"
    required: false
    default: "http://127.0.0.1:8200"

runs:
  using: "composite"
  steps:
    - name: Unseal OpenBao
      shell: bash
      env:
        UNSEAL_KEY: ${{ inputs.unseal_key }}
        VAULT_ADDR: ${{ inputs.vault_addr }}
      run: |
        if command -v curl >/dev/null 2>&1; then
          curl_cmd() { curl -s "$@"; }
        elif command -v wget >/dev/null 2>&1; then
          curl_cmd() {
            # Map curl arguments to wget where possible
            if [ "$1" = "--request" ] && [ "$2" = "PUT" ] && [ "$3" = "--data" ]; then
              wget -qO- --method=PUT --body-data="$4" "$5"
            else
              wget -qO- "$@"
            fi
          }
        else
          curl_cmd() { nix --extra-experimental-features 'nix-command flakes' run nixpkgs#curl -- -s "$@"; }
        fi
        
        HEALTH=$(curl_cmd $VAULT_ADDR/v1/sys/health || true)
        if [ -z "$HEALTH" ]; then
          echo "Error: OpenBao is unreachable at $VAULT_ADDR"
          exit 1
        fi
        
        if echo "$HEALTH" | grep -q '"sealed":true'; then
          echo "OpenBao is sealed. Attempting to auto-unseal..."
          if [ -z "$UNSEAL_KEY" ]; then
            echo "Error: UNSEAL_KEY input is not set. Please provide the keys."
            exit 1
          fi
          for key in $(echo "$UNSEAL_KEY" | tr ',' ' ' | tr '\n' ' '); do
            if [ -n "$key" ]; then
              curl_cmd --request PUT --data "{\"key\": \"$key\"}" $VAULT_ADDR/v1/sys/unseal > /dev/null
            fi
          done
          HEALTH=$(curl_cmd $VAULT_ADDR/v1/sys/health || true)
          if echo "$HEALTH" | grep -q '"sealed":true'; then
            echo "OpenBao is still sealed. Ensure you provided enough valid keys."
            exit 1
          else
            echo "OpenBao successfully unsealed!"
          fi
        else
          echo "OpenBao is already unsealed."
        fi
